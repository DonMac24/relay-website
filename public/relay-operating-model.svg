<svg xmlns="http://www.w3.org/2000/svg" width="900" height="675" viewBox="0 0 900 675" role="img" aria-labelledby="title desc">
<title id="title">Where Relay fits in the employee transition</title>
<desc id="desc">People and governance: HR monitors progress, managers review and assign work, and the next owner receives a handoff. Relay connects three workflow steps: Discover, Review and assign, Preview and publish. A continuity record links to existing work systems without granting access to them.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.kicker{fill:#2447A4;font-size:18px;font-weight:700;letter-spacing:1.3px}.head{fill:#1b211e;font-size:27px;font-weight:700}.role{fill:#1b211e;font-size:20px;font-weight:700}.sub{fill:#586761;font-size:16px}.step{fill:#1b211e;font-size:21px;font-weight:700}.minor{fill:#46587D;font-size:17px;font-weight:600}.num{fill:#2455D6;font-size:15px;font-weight:700}</style>
<rect x="1" y="1" width="898" height="673" rx="26" fill="#fcfefd" stroke="#DBE4FF" stroke-width="2"/>
<text x="36" y="52" class="kicker">WHERE RELAY FITS</text>
<text x="36" y="89" class="head">A continuity layer for work in transition</text>
<text x="36" y="126" class="kicker">PEOPLE &amp; GOVERNANCE</text>
<rect x="36" y="146" width="260" height="94" rx="15" fill="#fff" stroke="#DDE6FF" stroke-width="2"/>
<rect x="320" y="146" width="260" height="94" rx="15" fill="#fff" stroke="#DDE6FF" stroke-width="2"/>
<rect x="604" y="146" width="260" height="94" rx="15" fill="#fff" stroke="#DDE6FF" stroke-width="2"/>
<text x="55" y="180" class="role">HR</text><text x="55" y="211" class="sub">Monitors progress</text>
<text x="339" y="180" class="role">Manager</text><text x="339" y="211" class="sub">Reviews and assigns</text>
<text x="623" y="180" class="role">Next owner</text><text x="623" y="211" class="sub">Receives the handoff</text>
