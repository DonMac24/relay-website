<rect x="28" y="269" width="844" height="258" rx="20" fill="#EEF3FF" stroke="#2455D6" stroke-width="3"/>
<rect x="46" y="285" width="103" height="36" rx="8" fill="#1b211e"/>
<text x="63" y="311" fill="#fff" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700">RELAY</text>
<text x="163" y="310" class="kicker">CONTINUITY WORKFLOW</text>
<rect x="46" y="341" width="256" height="105" rx="13" fill="#fff" stroke="#DDE6FF" stroke-width="2"/>
<rect x="322" y="341" width="256" height="105" rx="13" fill="#fff" stroke="#DDE6FF" stroke-width="2"/>
<rect x="598" y="341" width="256" height="105" rx="13" fill="#fff" stroke="#DDE6FF" stroke-width="2"/>
<text x="64" y="369" class="num">01</text><text x="64" y="399" class="step">Discover</text><text x="64" y="426" class="sub">Find work and context</text>
<text x="340" y="369" class="num">02</text><text x="340" y="399" class="step">Review &amp; assign</text><text x="340" y="426" class="sub">Confirm the next owner</text>
<text x="616" y="369" class="num">03</text><text x="616" y="399" class="step">Preview &amp; publish</text><text x="616" y="426" class="sub">Share the handoff</text>
