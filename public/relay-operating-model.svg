<text x="48" y="488" class="minor">Continuity hub: ownership · linked context · risks · actions</text>
<path d="M450 528v25" fill="none" stroke="#CBD8FF" stroke-width="3"/>
<rect x="36" y="553" width="828" height="106" rx="15" fill="#fff" stroke="#DDE6FF" stroke-width="2"/>
<text x="55" y="581" class="kicker">EXISTING WORK SYSTEMS</text>
<text x="55" y="612" class="role">SharePoint · Outlook · Jira · Confluence · GitLab · Asana · more</text>
<text x="55" y="639" class="sub">Work stays in its original tools; source access stays separate.</text>
